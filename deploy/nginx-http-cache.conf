# Include from /etc/nginx/conf.d/ (http context).
# Public scoreboard micro-cache — 2s TTL, cache locking against thundering herd.

proxy_cache_path /var/cache/nginx/ai-arena
    levels=1:2
    keys_zone=ai_arena_public:16m
    max_size=128m
    inactive=30s
    use_temp_path=off;

upstream ai_arena_app {
    server 127.0.0.1:3000;
    server 127.0.0.1:3001;
    server 127.0.0.1:3002;
    server 127.0.0.1:3003;
    keepalive 64;
}
