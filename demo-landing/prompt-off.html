// ─── MILESTONE CARD ────────────────────────────────────────────────────────
function MilestoneCard({ color, bgColor, date, title, children, gradient }) {
  return (
    <div style={{
      flex: 1, border: `1px solid ${color}`, borderRadius: 16,
      padding: "16px 25px",
      boxShadow: "0 1px 2px rgba(0,0,0,.05)",
      display: "flex", flexDirection: "column", gap: 8,
      /* layer 1: solid white base  →  layer 2: tinted gradient on top */
      background: gradient
        ? `${gradient}, #ffffff`
        : "#ffffff",
      backdropFilter: "blur(8px)",
      WebkitBackdropFilter: "blur(8px)",
    }}>
      <div>
        <span style={{
          background: bgColor, border: `1px solid ${color}`,
          borderRadius: 8, padding: "5px 13px",
          fontFamily: "'Plus Jakarta Sans', sans-serif", fontWeight: 800,
          fontSize: 12, letterSpacing: "0.6px", color, textTransform: "uppercase",
        }}>

      </div>
      <p style={{
        fontFamily: "'Plus Jakarta Sans', sans-serif", fontWeight: 800,
        fontSize: 18, letterSpacing: "-0.45px", color: "#1e293b",
      }}>
        {title}
      </p>
      {children}
    </div>
  );
}

// ─── SPINE NODE ───────────────────────────────────────────────────────────
function SpineNode({ color, arrowLeft = false }) {
  return (
    <div style={{ display: "flex", alignItems: "center", flexShrink: 0 }}>
      {arrowLeft && (
        <>
          <div style={{ width: 32, height: 2, borderTop: `2px dashed ${color}` }} />
          <div style={{
            width: 0, height: 0,
            borderTop: "6px solid transparent", borderBottom: "6px solid transparent",
            borderRight: `9px solid ${color}`,
          }} />
        </>
      )}
      <div style={{
        width: 28, height: 28, borderRadius: "50%",
        background: "#fff", border: `4px solid ${color}`,
        boxShadow: "0 4px 6px -1px rgba(0,0,0,.1)",
        zIndex: 2, flexShrink: 0,
      }} />
      {!arrowLeft && (
        <>
          <div style={{
            width: 0, height: 0,
            borderTop: "6px solid transparent", borderBottom: "6px solid transparent",
            borderLeft: `9px solid ${color}`,
          }} />
          <div style={{ width: 32, height: 2, borderTop: `2px dashed ${color}` }} />
        </>
      )}
    </div>
  );
}
